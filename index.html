/* ===================== Rolling Fano v21 — sticker-book look =====================
   Everything on screen is a die-cut sticker: thick grape-ink outline, a hard offset shadow, candy colours.
   One memorable moment (the wordmark with the rolling ball for the O), everything else stays calm. */
:root{box-sizing:border-box;--ink:#2a1648;--ink2:#5b4390;--soft:#7a6a9c;--paper:#f8f4ff;--paper2:#ebe2ff;--line:#d9ccf5;
 --red:#ff4258;--red2:#d92a43;--sun:#ffc73a;--sun2:#f0a400;--mint:#2fd3a3;--mint2:#14a57c;--sky:#4cc3ff;--grape:#8a7bff;--pink:#ff7ab8;
 --f:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{height:100dvh;background:#0b1020;color:var(--ink);font-family:var(--f);font-weight:500;display:flex;flex-direction:column}
button,input,textarea{font-family:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#fd{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .45s}

/* ---------- in-game HUD ---------- */
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:center;z-index:4;pointer-events:none;color:#fff;font-weight:600}
#hud>*{pointer-events:auto}.sp{flex:1}
#hud .p{font-size:clamp(12px,3.6vh,17px);line-height:1.2;padding:3px 11px;border-radius:999px;background:rgba(42,22,72,.8);border:2px solid rgba(255,255,255,.32);box-shadow:0 2px 0 rgba(20,8,40,.55);transition:transform .15s}
#hud .p:first-child{background:var(--sun);color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
#hud .p:first-child:before{content:"Level ";font-weight:500;font-size:.85em}
#hud .p.pop{animation:hp .35s ease-out}@keyframes hp{40%{transform:scale(1.25)}}

function winExtras(first,newCoins,flaw){const X={b:[],tot:0,ach:[]},add=(ic,tx,c)=>{if(c>0){giveCoins(c);X.tot+=c}X.b.push([ic,tx,c])};
 const ns=Math.max(0,bsg.size-(WPR.s||0));if(ns)add('⭐','New star'+(ns>1?'s':''),ns*4);

 else if(stTab==='r'){const rows=[];for(let k=1;k<=NLV;k++){if(done[k]===undefined)continue;const r=rec[k]||{};rows.push(`<div class="rcc${r.g?' gd':''}"><b>${k%10?k:'👑'+k}</b><span>${r.t?fmtMs(r.t):'–'}</span><i>${'★'.repeat(r.s||0)}${'☆'.repeat(3-(r.s||0))}${r.g?'🥇':''}${r.f?'✨':''}</i></div>`)}
  const ts=Object.keys(rec).filter(k=>rec[k].t),fast=ts.length?ts.reduce((a,k)=>rec[k].t<rec[a].t?k:a):0;
